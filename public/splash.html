<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Windows RDP Manager</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }
    body {
      background: #0f172a;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      border: 1px solid rgba(51, 65, 85, 0.6);
      border-radius: 14px;
      overflow: hidden;
      padding: 24px;
      -webkit-app-region: drag;
    }
    .icon-container {
      position: relative;
      width: 72px;
      height: 72px;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .icon-glow {
      position: absolute;
      width: 60px;
      height: 60px;
      background: radial-gradient(circle, rgba(59, 130, 246, 0.45) 0%, rgba(59, 130, 246, 0) 70%);
      filter: blur(10px);
      z-index: 0;
    }
    .icon-img {
      position: relative;
      width: 64px;
      height: 64px;
      object-fit: contain;
      z-index: 1;
      filter: drop-shadow(0 4px 12px rgba(0, 0, 0, 0.4));
    }
    .title-group {
      text-align: center;
      margin-bottom: 20px;
    }
    .title {
      font-size: 19px;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: #f8fafc;
      margin-bottom: 4px;
    }
    .subtitle {
      font-size: 12px;
      color: #94a3b8;
      font-weight: 500;
    }
    .loader-container {
      width: 220px;
      height: 4px;
      background: #1e293b;
      border-radius: 999px;
      overflow: hidden;
      position: relative;
      margin-bottom: 12px;
    }
    .loader-bar {
      position: absolute;
      top: 0;
      left: 0;
      bottom: 0;
      width: 40%;
      background: linear-gradient(90deg, #3b82f6, #6366f1);
      border-radius: 999px;
      animation: indeterminate 1.4s ease-in-out infinite;
    }
    @keyframes indeterminate {
      0% {
        left: -40%;
        width: 30%;
      }
      50% {
        left: 35%;
        width: 50%;
      }
      100% {
        left: 100%;
        width: 40%;
      }
    }
    .status-text {
      font-size: 11px;
      color: #64748b;
      font-weight: 500;
    }
  </style>
</head>
<body>
  <div class="icon-container">
    <div class="icon-glow"></div>
    <img src="icon.png" alt="Windows RDP Manager" class="icon-img" />
  </div>
  <div class="title-group">
    <h1 class="title">Windows RDP Manager</h1>
    <p class="subtitle">Gerenciador de Conexões Remotas</p>
  </div>
  <div class="loader-container">
    <div class="loader-bar"></div>
  </div>
  <span class="status-text">Inicializando conexões e perfis...</span>
</body>
</html>
